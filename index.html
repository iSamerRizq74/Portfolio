<!doctype html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Samer Baher Rizk | Portfolio</title>
  <style>
    #root, #error-container {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', sans-serif;
    }
    #error-container {
      display: none;
      padding: 2rem;
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      border-radius: 4px;
      margin: 1rem;
    }
    #error-container h2 {
      margin-top: 0;
      color: #721c24;
    }
    #error-details {
      white-space: pre-wrap;
      background: white;
      padding: 1rem;
      border-radius: 4px;
      margin-top: 1rem;
      font-family: monospace;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <div id="root">
    <div style="padding: 2rem; text-align: center;">
      <h1>Loading Portfolio...</h1>
      <p>If this takes too long, please check the browser console for errors.</p>
    </div>
  </div>
  
  <div id="error-container">
    <h2>Application Error</h2>
    <p>An error occurred while loading the application. Details below:</p>
    <div id="error-details"></div>
  </div>

  <script>
    // Enhanced error handler with more details
    window.addEventListener('error', function(event) {
      console.error('Global error:', event.error || event.message, event);
      const errorContainer = document.getElementById('error-container');
      const errorDetails = document.getElementById('error-details');
      
      if (errorContainer && errorDetails) {
        const errorInfo = {
          message: event.message || 'Unknown error',
          type: event.type || 'error',
          filename: event.filename || 'unknown',
          lineno: event.lineno || 'unknown',
          colno: event.colno || 'unknown',
          error: event.error ? {
            name: event.error.name,
            message: event.error.message,
            stack: event.error.stack
          } : 'No error object'
        };
        
        errorDetails.innerHTML = `
          <div><strong>Error:</strong> ${errorInfo.message}</div>
          <div><strong>Type:</strong> ${errorInfo.type}</div>
          <div><strong>File:</strong> ${errorInfo.filename}</div>
          <div><strong>Line:</strong> ${errorInfo.lineno}:${errorInfo.colno}</div>
          ${errorInfo.error.stack ? `
            <div class="mt-2"><strong>Stack Trace:</strong></div>
            <pre class="bg-white p-2 rounded mt-1 text-xs overflow-auto">${errorInfo.error.stack}</pre>
          ` : ''}
        `;
        
        errorContainer.style.display = 'block';
        document.getElementById('root').style.display = 'none';
      }
    });

    // Unhandled promise rejections
    window.addEventListener('unhandledrejection', function(event) {
      console.error('Unhandled rejection:', event.reason);
      const errorContainer = document.getElementById('error-container');
      const errorDetails = document.getElementById('error-details');
      
      if (errorContainer && errorDetails) {
        errorDetails.innerHTML = `
          <div><strong>Unhandled Promise Rejection:</strong></div>
          <div>${event.reason?.message || String(event.reason) || 'Unknown error'}</div>
          ${event.reason?.stack ? `
            <div class="mt-2"><strong>Stack Trace:</strong></div>
            <pre class="bg-white p-2 rounded mt-1 text-xs overflow-auto">${event.reason.stack}</pre>
          ` : ''}
        `;
        
        errorContainer.style.display = 'block';
        document.getElementById('root').style.display = 'none';
      }
    });

    // Log when the script starts
    console.log('Initial script loaded');
  </script>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
